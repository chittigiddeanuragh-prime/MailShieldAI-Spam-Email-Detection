[project]
name = "mailshield-ai"
version = "1.0.0"
description = "🛡️ MailShield AI — Intelligent Email Threat & Spam Detection System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MailShield AI Team" }
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pandas>=2.2.3",
    "beautifulsoup4>=4.12.3",
    "scikit-learn>=1.6.1",
    "pydantic>=2.10.6",
    "streamlit>=1.32.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
